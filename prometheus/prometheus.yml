global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # Express API running on the host; host.docker.internal lets the container reach it
  - job_name: express-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:3001

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8889
